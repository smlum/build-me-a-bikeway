<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="navbar">
        <h1>🚴 Build me a Bikeway</h1>
    </div>

    <div class="modal-overlay">
        <div class="modal-content">
            <h3>Reset Password</h3>
            <form id="resetPasswordForm">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" required><br><br>
                <button type="submit">Reset Password</button>
                <p id="reset-status" style="display:none;"></p>
            </form>
        </div>
    </div>

    <script>
        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const statusEl = document.getElementById('reset-status');

        function showStatus(message, isError) {
            statusEl.textContent = message;
            statusEl.style.color = isError ? '#c0392b' : '#27ae60';
            statusEl.style.display = 'block';
        }

        resetPasswordForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPassword = document.getElementById('newPassword').value;

            if (!token || !newPassword) {
                showStatus('Invalid or missing token/password.', true);
                return;
            }

            try {
                const apiBase = window.location.hostname === 'localhost' ? 'http://localhost:3000' : '';
                const response = await fetch(`${apiBase}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || 'Server error');
                }

                showStatus('Password reset! Redirecting…', false);
                setTimeout(() => { window.location.href = '/'; }, 1500);
            } catch (error) {
                showStatus('Reset failed: ' + error.message, true);
            }
        });
    </script>
</body>
</html>
